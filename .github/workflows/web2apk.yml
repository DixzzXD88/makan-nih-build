name: Web to APK
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: Website URL
        required: true
      app_name:
        description: Application name
        required: true
      icon_url:
        description: Icon URL
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project
        run: |
          flutter create --org com.dixzzxd --project-name webtoapk webapp
          cd webapp
          flutter pub add webview_flutter
          mkdir -p assets
          if [ -n "${{ inputs.icon_url }}" ]; then
            curl -L -o assets/app_icon.png "${{ inputs.icon_url }}" || rm -f assets/app_icon.png
          fi
      - name: Configure app
        working-directory: webapp
        env:
          WEB_URL: "${{ inputs.web_url }}"
          APP_NAME: "${{ inputs.app_name }}"
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          void main() {
            runApp(const BuilderApp());
          }
          class BuilderApp extends StatelessWidget {
            const BuilderApp({super.key});
            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: WebScreen(),
              );
            }
          }
          class WebScreen extends StatefulWidget {
            const WebScreen({super.key});
            @override
            State<WebScreen> createState() => _WebScreenState();
          }
          class _WebScreenState extends State<WebScreen> {
            late final WebViewController controller;
            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('WEB_URL_PLACEHOLDER'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(body: WebViewWidget(controller: controller));
            }
          }
          DART
          python3 - <<'PY'
          import os
          import pathlib
          page = pathlib.Path('lib/main.dart')
          page.write_text(page.read_text().replace('WEB_URL_PLACEHOLDER', os.environ['WEB_URL']))
          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text().replace('android:label="webapp"', 'android:label="' + os.environ['APP_NAME'] + '"')
          lines = text.splitlines()
          if not any('INTERNET' in line for line in lines):
              lines.insert(1, '    <uses-permission android:name="android.permission.INTERNET" />')
          sep = chr(10)
          manifest.write_text(sep.join(lines) + sep)
          PY
          if [ -f assets/app_icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            cat >> pubspec.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/app_icon.png
            adaptive_icon_background: white
            adaptive_icon_foreground: assets/app_icon.png
          YAML
            dart run flutter_launcher_icons
          fi
      - name: Build
        working-directory: webapp
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-release.apk
          if-no-files-found: error