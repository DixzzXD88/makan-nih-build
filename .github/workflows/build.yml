name: Build APK from ZIP
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL of the uploaded ZIP
        required: true
      tag:
        description: Build tag
        required: true
      build_type:
        description: Build type
        required: true
        default: release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Download source
        run: |
          mkdir -p source
          curl -L -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/octet-stream" -o source/project.zip "${{ inputs.zip_url }}"
          cd source
          unzip -q project.zip
          rm project.zip
      - name: Locate project
        id: locate
        run: |
          ROOT=$(find source -name pubspec.yaml -type f -not -path "*build*" | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi
          echo "dir=$(dirname "$ROOT")" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          flutter pub get
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
            cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"
          else
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app-debug.apk
            app-release.apk
          if-no-files-found: error